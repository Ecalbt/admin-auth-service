# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:admin_auth_db}
spring.datasource.username=${DB_USER:admin_user}
spring.datasource.password=${DB_PASSWORD:admin_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# JWT Security Settings
app.jwt.issuer=${JWT_ISSUER:https://auth.autoeaning.ocb.com.vn}
app.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
app.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:86400}
app.jwt.key-id=${JWT_KEY_ID:ocb-admin-auth-key-1}

# MFA Settings
app.mfa.issuer=${MFA_ISSUER:OCB-AutoEarning-Admin}
app.mfa.token-expiration-seconds=${MFA_TOKEN_EXPIRATION_SECONDS:300}

# Security Guardrails
app.security.max-failed-attempts=${SECURITY_MAX_FAILED_ATTEMPTS:5}
app.security.lockout-duration-minutes=${SECURITY_LOCKOUT_DURATION_MINUTES:30}
app.security.session-idle-timeout-minutes=${SECURITY_SESSION_IDLE_TIMEOUT_MINUTES:30}
app.security.max-concurrent-sessions=${SECURITY_MAX_CONCURRENT_SESSIONS:5}

# Kafka & Schema Registry (Dev)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8082}
spring.kafka.properties.auto.register.schemas=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.compression.type=zstd
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.batch-size=32768
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.delivery.timeout.ms=120000
