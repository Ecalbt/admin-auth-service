# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/admin_auth_db
spring.datasource.username=admin_user
spring.datasource.password=admin_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# JWT Security Settings
app.jwt.issuer=https://auth.autoeaning.ocb.com.vn
app.jwt.access-token-expiration-seconds=1800
app.jwt.refresh-token-expiration-seconds=86400
app.jwt.key-id=ocb-admin-auth-key-1

# MFA Settings
app.mfa.issuer=OCB-AutoEarning-Admin
app.mfa.token-expiration-seconds=300

# Security Guardrails
app.security.max-failed-attempts=5
app.security.lockout-duration-minutes=30
app.security.session-idle-timeout-minutes=30
app.security.max-concurrent-sessions=5

# Kafka & Schema Registry (Dev)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.schema.registry.url=http://localhost:8082
spring.kafka.properties.auto.register.schemas=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.compression.type=zstd
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.batch-size=32768
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.delivery.timeout.ms=120000
