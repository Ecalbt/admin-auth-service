spring.application.name=admin-auth-service
server.port=8081
server.servlet.context-path=/api

# Profiles
spring.profiles.active=dev

# Springdoc OpenAPI (Swagger)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=true
springdoc.model-converters.pageable-converter.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,ready
management.endpoint.health.show-details=always

# JWT Key Persistence
app.jwt.keys-dir=./keys

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:8081,http://127.0.0.1:3000

