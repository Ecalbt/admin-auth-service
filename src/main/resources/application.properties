spring.application.name=admin-auth-service
server.port=8081
server.servlet.context-path=/api

# Profiles
spring.profiles.active=dev

# Springdoc OpenAPI (Swagger)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=true
springdoc.model-converters.pageable-converter.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,ready
management.endpoint.health.show-details=always

# JWT Key Persistence
app.jwt.keys-dir=./keys

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:8081,http://127.0.0.1:3000

# Kafka Topics
app.kafka.topics.audit-events=admin.auth.audit.events
app.kafka.topics.notification-events=admin.auth.notification.events

# Outbox Settings
app.outbox.relay.enabled=true
app.outbox.relay.fixed-delay-ms=500
app.outbox.relay.batch-size=100
app.outbox.relay.max-attempts=10
app.outbox.cleaner.retention-days=14

