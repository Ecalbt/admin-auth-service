spring.application.name=ae-admin-auth-service
server.port=${SERVER_PORT:8081}
server.servlet.context-path=${APP_CONTEXT_PATH:/api}

# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Springdoc OpenAPI (Swagger)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=true
springdoc.model-converters.pageable-converter.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,ready
management.endpoint.health.show-details=always

# JWT Key Persistence
app.jwt.keys-dir=${JWT_KEYS_DIR:./keys}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://127.0.0.1:3000}

# Kafka Topics
app.kafka.topics.audit-events=${KAFKA_TOPIC_AUDIT:admin.auth.audit.events}
app.kafka.topics.notification-events=${KAFKA_TOPIC_NOTIFICATION:admin.auth.notification.events}

# Outbox Settings
app.outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
app.outbox.relay.fixed-delay-ms=${OUTBOX_RELAY_FIXED_DELAY_MS:500}
app.outbox.relay.batch-size=${OUTBOX_RELAY_BATCH_SIZE:100}
app.outbox.relay.max-attempts=${OUTBOX_RELAY_MAX_ATTEMPTS:10}
app.outbox.cleaner.retention-days=${OUTBOX_CLEANER_RETENTION_DAYS:14}
