spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=false

# Redis disabled or mock in unit tests
spring.data.redis.host=localhost
spring.data.redis.port=6379

app.jwt.issuer=https://auth.autoeaning.ocb.com.vn
app.jwt.access-token-expiration-seconds=1800
app.jwt.refresh-token-expiration-seconds=86400
app.jwt.key-id=test-auth-key-1

app.mfa.issuer=OCB-Test-Admin
app.mfa.token-expiration-seconds=300

app.security.max-failed-attempts=5
app.security.lockout-duration-minutes=30
app.security.session-idle-timeout-minutes=30
app.security.max-concurrent-sessions=5

# Outbox disabled in unit tests
app.outbox.relay.enabled=false
app.kafka.topics.audit-events=admin.auth.audit.events
app.kafka.topics.notification-events=admin.auth.notification.events

